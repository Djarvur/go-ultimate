# CI for go-ultimate. The skill ships Go code as per-template modules under
# skills/go-ultimate/assets/*/ (each with its own go.mod), plus markdown docs.
# This workflow gates every push and pull request on:
#   - each template: build, vet, test -race, tidy, golangci-lint
#   - repo-wide:     gofmt clean, markdown links resolve, version consistency
# The upstream-drift check is scheduled separately (source-versions.yml).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Single matrix job: enumerate the template directories and run the Go gates
  # in each. One failing template fails the job, with a clear name in the matrix.
  templates:
    name: template (${{ matrix.template }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        template: [cli-simple, cli-cobra, game, library, mcp-server, webservice]
    defaults:
      run:
        working-directory: skills/go-ultimate/assets/${{ matrix.template }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: skills/go-ultimate/assets/${{ matrix.template }}/go.mod
          cache-dependency-path: skills/go-ultimate/assets/${{ matrix.template }}/go.sum
      - run: go mod download
      # The game template uses ebiten, whose GLFW-based graphics driver needs
      # the X11/Mesa/ALSA C dev headers to build on Linux. Other templates are
      # pure Go or stdlib-only and skip this step.
      - name: Install native graphics deps (game template only)
        if: matrix.template == 'game'
        run: |
          sudo apt-get update
          sudo apt-get install -y libc6-dev libgl1-mesa-dev libx11-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev libxxf86vm-dev libasound2-dev pkg-config
        working-directory: ${{ github.workspace }}
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./...
      # Fail if go.mod (and go.sum, when it exists) are not tidy. Stdlib-only
      # templates have no go.sum; only diff the files that exist.
      - run: |
          go mod tidy
          files="go.mod"
          [ -f go.sum ] && files="$files go.sum"
          git diff --exit-code -- $files
      - uses: golangci/golangci-lint-action@v7
        with:
          # Pin to v2: v1.x is built with Go < 1.26 and cannot lint go 1.26
          # modules ("language version used to build golangci-lint is lower
          # than the targeted Go version"). v2.9.0+ is built with Go 1.26.
          # Requires golangci-lint-action v7+ (v6 rejects v2 version strings).
          version: v2.12
          working-directory: skills/go-ultimate/assets/${{ matrix.template }}

  # Repo-wide: gofmt clean across all .go files.
  gofmt:
    name: gofmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          bad=$(gofmt -l .)
          if [ -n "$bad" ]; then
            echo "::error::gofmt would reformat:$bad"
            echo "$bad"
            exit 1
          fi

  # Repo-wide: every markdown link resolves. Catches the class of bug in issue #5.
  links:
    name: markdown links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          # Check relative and remote links in markdown. Skip the installed-plugin
          # cache if present. Fail on any broken link.
          args: >-
            --no-progress
            --root-dir ${{ github.workspace }}
            '*.md' '**/*.md'

  # Repo-wide: the version must be identical in plugin.json, SKILL.md, README.md.
  version-consistency:
    name: version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          bash skills/go-ultimate/scripts/check-version-consistency.sh
