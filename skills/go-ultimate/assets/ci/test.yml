  # compat:
  #   name: go ${{ matrix.go }}
  #   runs-on: ubuntu-latest
  #   strategy:
  #     fail-fast: false
  #     matrix:
  #       go: ['1.25', '1.26']
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: actions/setup-go@v5
  #       with:
  #         go-version: ${{ matrix.go }}
  #     - run: go test -race ./...
